services:
  tg_bot:
    build: .
    container_name: tg_bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./dumps:/app/dumps
    depends_on: []

volumes:
  bot_data:
  bot_logs:
  bot_dumps:
