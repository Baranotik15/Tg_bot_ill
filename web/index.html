<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🎲 Ставки</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            font-family: system-ui;
            background: #0f172a;
            color: #e5e7eb;
        }

        header {
            padding: 16px;
            background: #020617;
            text-align: center;
            font-weight: bold;
        }

        .container {
            padding: 16px;
            max-width: 520px;
            margin: auto;
        }

        .card {
            background: #020617;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            position: relative;
        }

        .event-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-top: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease, opacity .15s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
            opacity: .95;
        }

        .red {
            background: #b91c1c;
            color: #fff;
        }

        .black {
            background: #111827;
            color: #fff;
            border: 1px solid #374151;
        }

        .admin {
            background: #2563eb;
            color: #fff;
        }

        .gear {
            width: auto;
            padding: 4px 6px;
            font-size: 16px;
            background: transparent;
            color: #9ca3af;
            margin: 0;
        }

        .gear:hover {
            color: #fff;
            box-shadow: none;
            transform: scale(1.15);
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-top: 8px;
            font-size: 16px;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            z-index: 1000;
        }

        #modal-content {
            background: #020617;
            padding: 16px;
            border-radius: 12px;
            max-width: 400px;
            margin: 30% auto;
        }
    </style>
</head>

<body>
<header>🎲 Ставки</header>

<div class="container">
    <div id="admin-controls"></div>

    <div class="card">
        <div id="balance">Баланс: …</div>
    </div>

    <div id="events"></div>
</div>

<div id="modal">
    <div id="modal-content"></div>
</div>

<script src="/static/app.js?v=45"></script>
</body>
</html>
