<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>🎲 Ставки</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }

        header {
            padding: 16px;
            background: #020617;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            padding: 16px;
            max-width: 520px;
            margin: auto;
        }

        .card {
            background: #020617;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .balance {
            font-size: 18px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        .red {
            background: #b91c1c;
            color: white;
        }

        .black {
            background: #111827;
            color: white;
            border: 1px solid #374151;
        }

        .event-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-top: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>
<header>🎲 Ставки</header>

<div class="container">
    <div class="card">
        <div class="balance" id="balance">Баланс: …</div>
    </div>

    <div id="events"></div>
</div>

<script src="/static/app.js?v=2"></script>
</body>
</html>
