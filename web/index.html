<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🎲 Ставки</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body { margin:0; font-family:system-ui; background:#0f172a; color:#e5e7eb }
        header { padding:16px; background:#020617; text-align:center; font-weight:bold }
        .container { padding:16px; max-width:520px; margin:auto }
        .card { background:#020617; border-radius:12px; padding:14px; margin-bottom:14px }
        button { width:100%; padding:10px; border-radius:8px; border:none; margin-top:8px }
        .red { background:#b91c1c; color:#fff }
        .black { background:#111827; color:#fff; border:1px solid #374151 }
        .admin { background:#2563eb; color:#fff }
        input { width:100%; padding:10px; border-radius:8px; border:none; margin-top:8px }

        #modal {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.6);
            z-index:1000;
        }
        #modal-content {
            background:#020617;
            padding:16px;
            border-radius:12px;
            max-width:400px;
            margin:30% auto;
        }
    </style>
</head>

<body>
<header>🎲 Ставки</header>

<div class="container">
    <div id="admin-controls"></div>

    <div class="card">
        <div id="balance">Баланс: …</div>
    </div>

    <div id="events"></div>
</div>

<div id="modal">
    <div id="modal-content"></div>
</div>

<script src="/static/app.js?v=35"></script>
</body>
</html>
