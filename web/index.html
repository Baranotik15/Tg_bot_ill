<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🎲 Ставки</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui;
            background: #0f172a;
            color: #e5e7eb;
        }

        header {
            padding: 16px;
            background: #020617;
            text-align: center;
            font-weight: bold;
        }

        .container {
            padding: 12px 16px 8px;
            max-width: 520px;
            margin: auto;
        }

        .card {
            background: #020617;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .event-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button,
        input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border-radius: 10px;
            border: none;
            margin-top: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
            transition: transform .12s ease, opacity .12s;
        }

        button:hover {
            transform: scale(1.02);
            opacity: .95;
        }

        .red {
            background: #b91c1c;
            color: #fff;
        }

        .black {
            background: #111827;
            color: #fff;
            border: 1px solid #374151;
        }

        .admin {
            background: #2563eb;
            color: #fff;
        }

        .promo {
            background: #16a34a;
            color: #fff;
            font-weight: 600;
        }

        .admin-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .admin-row button {
            flex: 1;
        }

        .gear {
            background: transparent;
            color: #9ca3af;
            font-size: 16px;
            padding: 4px 6px;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.65);
            z-index: 1000;
        }

        #modal-content {
            background: #020617;
            border-radius: 14px;
            max-width: 420px;
            width: calc(100% - 24px);
            margin: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        #top-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
        }

        .top-row {
            display: grid;
            grid-template-columns: 26px 1fr auto;
            gap: 8px;
            align-items: center;
        }

        .top-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .top-score {
            font-variant-numeric: tabular-nums;
        }

        #empty-state {
            display: none;
            text-align: center;
            padding: 10px 0 0;
        }

        #empty-state img {
            width: 300px;
            max-width: 95%;
            margin: 10px auto 14px;
            display: block;
        }

        #empty-state .empty-text {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            opacity: 0.9;
        }
    </style>
</head>

<body>
<header>🎲 Ставки</header>

<div class="container">
    <div id="admin-controls"></div>

    <div class="card">
        <div style="font-weight:bold; margin-bottom:8px">🏆 Топ 5 игроков</div>
        <div id="top-list">Загрузка…</div>
    </div>

    <div class="card">
        <div id="balance">Баланс: …</div>
    </div>

    <div id="empty-state">
        <img src="/static/1.png?v=5" alt="Нет событий">
        <div class="empty-text">
            Сейчас нет активных событий
        </div>
    </div>

    <div id="events"></div>
</div>

<div id="modal">
    <div id="modal-content"></div>
</div>

<script src="/static/app.js?v=58"></script>
</body>
</html>
